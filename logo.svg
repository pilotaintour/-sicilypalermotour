<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="100%">
    <defs>
        <!-- SFUMATURA ORO LUSSUOSA -->
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B" />
            <stop offset="50%" stop-color="#D97706" />
            <stop offset="100%" stop-color="#92400E" />
        </linearGradient>

        <linearGradient id="goldLightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FEF08A" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>

        <!-- OMBRA GLOW ORO -->
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- STEMMA EMBLEMA SICILIANO LUSSO ORIGINAL -->
    <g transform="translate(12, 16) scale(1.18)">
        <!-- Cerchio di Sfondo con Bagliore Oro -->
        <circle cx="55" cy="55" r="50" fill="#0B2545" stroke="url(#goldGradient)" stroke-width="3.5" filter="url(#goldGlow)" />
        <circle cx="55" cy="55" r="44" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,2" />

        <!-- Stella Imperiale / Sole Siciliano -->
        <path d="M55,18 L58,32 L72,32 L60,40 L65,54 L55,45 L45,54 L50,40 L38,32 L52,32 Z" fill="#F59E0B" opacity="0.3" />

        <!-- Tempio Arabo-Normanno / Trinacria Icona -->
        <!-- Frontone Tempio -->
        <path d="M35,46 L55,28 L75,46 Z" fill="url(#goldLightGradient)" />
        <rect x="37" y="47" width="36" height="3" fill="url(#goldGradient)" />
        <!-- Colonne Tempio -->
        <rect x="39" y="52" width="4" height="22" rx="1" fill="#FEF08A" />
        <rect x="47" y="52" width="4" height="22" rx="1" fill="#FEF08A" />
        <rect x="55" y="52" width="4" height="22" rx="1" fill="#FEF08A" />
        <rect x="63" y="52" width="4" height="22" rx="1" fill="#FEF08A" />
        <rect x="71" y="52" width="4" height="22" rx="1" fill="#FEF08A" />
        <!-- Base Tempio -->
        <rect x="35" y="75" width="40" height="5" rx="1" fill="url(#goldGradient)" />

        <!-- Corona d'Alloro Laterale -->
        <path d="M22,55 C22,72 34,84 52,86" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />
        <path d="M88,55 C88,72 76,84 58,86" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linecap="round" />

        <!-- Foglie Alloro -->
        <circle cx="21" cy="52" r="2.5" fill="#FEF08A" />
        <circle cx="23" cy="64" r="2.5" fill="#FEF08A" />
        <circle cx="29" cy="74" r="2.5" fill="#FEF08A" />
        <circle cx="89" cy="52" r="2.5" fill="#FEF08A" />
        <circle cx="87" cy="64" r="2.5" fill="#FEF08A" />
        <circle cx="81" cy="74" r="2.5" fill="#FEF08A" />
    </g>

    <!-- TESTO LOGO SICILY PALERMO TOUR -->
    <!-- Sottotitolo Superiore -->
    <text x="150" y="28" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="22" font-weight="800" fill="#D97706" letter-spacing="5.1">
        ⭐ OFFICIAL LUXURY GUIDED TOURS ⭐
    </text>

    <!-- Nome Principale -->
    <text x="150" y="88" font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" font-size="58" font-weight="900" fill="#0B2545" letter-spacing="0.5">
        Sicily Palermo Tour
    </text>

    <!-- Sottotitolo Descrizione -->
    <text x="150" y="142" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="23.5" font-weight="800" fill="#1E3A8A" letter-spacing="2.85">
        Esperienze &amp; Itinerari Guidati d'Eccellenza
    </text>
</svg>
