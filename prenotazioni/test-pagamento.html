<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferma Prenotazione e Pagamento - Sicily Palermo Tour</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../itinerari/itinerari.css">
    <link rel="stylesheet" href="../whatsapp/whatsapp.css">
    <link rel="stylesheet" href="calendario.css">
    <link rel="stylesheet" href="booking-wizard.css">
    <script src="https://js.stripe.com/v3/"></script>
    <script src="stripe-payment.js"></script>
    <script src="../email/email-service.js"></script>
    <script src="../cloud/cloud-db.js"></script>
    <script src="step4-conferma.js"></script>
</head>
<body style="background: #f4f7f9; padding: 20px 10px;">

    <!-- Header Logo & Navigazione Premium -->
    <header style="max-width: 860px; margin: 0 auto 20px auto; border-radius: 16px; padding: 18px 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;">
            <a href="../index.html" style="text-decoration: none; display: flex; align-items: center;">
                <img src="../logo.svg" alt="Sicily Palermo Tour" style="max-width: 280px; width: 100%; height: auto; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));">
            </a>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.85rem; background: rgba(255,255,255,0.15); color: white; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25); font-weight: bold;">
                    🔒 Checkout Sicuro SSL
                </span>
                <a href="../index.html" class="btn-secondary" style="color: white; text-decoration: none; border-color: rgba(255,255,255,0.5); font-size: 0.88rem; padding: 8px 14px;">← Torna al Sito</a>
            </div>
        </div>
    </header>

    <div style="max-width: 860px; margin: 0 auto;">

        <!-- Contenitore Step 4 Premium -->
        <div id="test-step4-container" class="wizard-step-card" style="display: block !important;"></div>

    </div>

    <!-- Footer -->
    <footer style="text-align: center; margin-top: 30px; font-size: 0.85rem; color: #64748b;">
        <p>&copy; 2025 Sicily Palermo Tour - Tutti i diritti riservati.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const demoBookingData = {
                code: '#SPT-' + Math.floor(1000 + Math.random() * 9000),
                tourTitle: 'Tour Palermo Centro Storico & I Miti del Capo',
                dateReadable: '28 Maggio 2025',
                slotTime: '09:30',
                adults: 2,
                children: 0,
                customerName: 'Mario Rossi',
                customerEmail: 'pilotaintour13@gmail.com',
                customerPhone: '+39 340 1234567',
                language: 'Italiano',
                country: 'Italia',
                billingAddress: 'Via Cavour 12, Palermo 90133',
                total: '50.00',
                participantsList: [
                    { name: 'Mario Rossi', dob: '15/05/1990', origin: 'Roma', notes: 'Visita guidata in italiano' },
                    { name: 'Anna Verdi', dob: '20/08/1992', origin: 'Milano', notes: '' }
                ]
            };

            const step4 = new Step4Conferma('test-step4-container', {
                onPrev: () => { window.location.href = '../index.html'; },
                onConfirm: (res) => {
                    // Salva nel localStorage prenotazioni per l'Admin
                    try {
                        const list = JSON.parse(localStorage.getItem('spt_bookings') || '[]');
                        const record = {
                            ...demoBookingData,
                            paymentIntentId: (res && res.paymentIntentId) ? res.paymentIntentId : '',
                            id: Date.now().toString(),
                            createdAt: new Date().toLocaleString('it-IT'),
                            status: 'In attesa'
                        };
                        list.unshift(record);
                        localStorage.setItem('spt_bookings', JSON.stringify(list));

                        // Sincronizza nel Cloud
                        if (window.cloudDB) {
                            window.cloudDB.salvaPrenotazioniCloud(list);
                        }

                        // Invia email automatica via Brevo
                        if (window.brevoEmailService) {
                            window.brevoEmailService.inviaEmailPrenotazione(record);
                        }
                    } catch (e) {
                        console.error("Errore salvataggio booking:", e);
                    }

                    alert(`🎉 PRENOTAZIONE CONFERMATA CON SUCCESSO!\n\nCodice: ${demoBookingData.code}\nTour: ${demoBookingData.tourTitle}\nTotale Pre-Autorizzato: €${demoBookingData.total}\n\nLa prenotazione è stata ricevuta. Ti invieremo un'email di conferma con tutte le informazioni per il punto di incontro!`);

                    window.location.href = '../index.html';
                }
            });

            step4.renderSummary(demoBookingData);
        });
    </script>
</body>
</html>
