<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Tour Palermo - Sicily Palermo Tour</title>
    <link rel="stylesheet" href="../style.css?v=4">
    <link rel="stylesheet" href="../itinerari/itinerari.css?v=4">
    <link rel="stylesheet" href="../whatsapp/whatsapp.css?v=4">
    <link rel="stylesheet" href="calendario.css?v=4">
    <link rel="stylesheet" href="booking-wizard.css?v=4">
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR&disable-funding=card,mybank,sofort,paylater"></script>
    <script src="stripe-payment.js?v=4"></script>
    <script src="../email/email-service.js?v=4"></script>
    <script src="../cloud/cloud-db.js?v=4"></script>
    <script src="../itinerari/itinerari-data.js?v=4"></script>
    <script src="calendario.js?v=4"></script>
    <script src="step1-data-orario.js?v=4"></script>
    <script src="step2-partecipanti.js?v=4"></script>
    <script src="step3-dati.js?v=4"></script>
    <script src="step4-conferma.js?v=4"></script>
</head>
<body>

    <!-- Header e Navigazione con Selettore Multilingua -->
    <header style="padding: 15px 10px;">
        <div style="display: flex; justify-content: center; align-items: center; max-width: 850px; margin: 0 auto; text-align: center;">
            <a href="../index.html" style="text-decoration: none; display: inline-block;">
                <img src="../logo.svg" alt="Sicily Palermo Tour Logo" style="max-width: 650px; width: 92%; height: auto; filter: drop-shadow(0 4px 15px rgba(0,0,0,0.6)); display: block; margin: 0 auto;">
            </a>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">← Torna agli Itinerari</a></li>
            <li><a href="../index.html#contatti">Contatti</a></li>
            <li><div id="google_translate_element" style="display:inline-block; vertical-align:middle;"></div></li>
        </ul>
    </nav>

    <!-- Barra di Avanzamento Step con Clic sugli Step già Completati -->
    <div class="steps-bar-container">
        <div class="steps-bar">
            <div class="step-item active" id="bar-step-1" onclick="wizardManager.tryGoToStep(1)">
                <span class="step-badge">1</span>
                <span class="step-label">Data & Ora</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" id="bar-step-2" onclick="wizardManager.tryGoToStep(2)">
                <span class="step-badge">2</span>
                <span class="step-label">Partecipanti</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" id="bar-step-3" onclick="wizardManager.tryGoToStep(3)">
                <span class="step-badge">3</span>
                <span class="step-label">I Tuoi Dati</span>
            </div>
            <div class="step-connector"></div>
            <div class="step-item" id="bar-step-4" onclick="wizardManager.tryGoToStep(4)">
                <span class="step-badge">4</span>
                <span class="step-label">Conferma & Paga</span>
            </div>
        </div>
    </div>

    <!-- Contenitore Principale del Wizard -->
    <main class="wizard-container">

        <!-- Banner Hero Dettaglio Tour Selezionato -->
        <div class="tour-selected-banner">
            <div class="tour-selected-img-box">
                <img id="tour-hero-img" src="https://images.unsplash.com/photo-1541370976299-4d24ebbc9077?auto=format&fit=crop&w=1200&q=80" alt="Tour Selezionato">
            </div>
            <div class="tour-selected-info">
                <span id="booking-tour-category" class="badge">Sicily Palermo Tour</span>
                <span id="booking-ref-code" class="booking-ref-badge">Codice: #SPT-BOOK</span>
                <h1 id="booking-tour-title">Tour Guidato Palermo</h1>
                <div class="tour-highlights-chips">
                    <span id="chip-duration" class="chip-item">⏱️ Durata: 3 Ore</span>
                    <span id="chip-price" class="chip-item">💰 Prezzo: Da 25€</span>
                    <span id="chip-meeting" class="chip-item">📍 Incontro: Palermo Centro</span>
                </div>
            </div>
        </div>

        <!-- CARDS STEP DINAMICHE -->
        <div class="wizard-step-card" id="step-card-1">
            <!-- Modulo Step 1 montato via JS -->
        </div>

        <div class="wizard-step-card hidden-step" id="step-card-2">
            <!-- Modulo Step 2 montato via JS -->
        </div>

        <div class="wizard-step-card hidden-step" id="step-card-3">
            <!-- Modulo Step 3 montato via JS -->
        </div>

        <div class="wizard-step-card hidden-step" id="step-card-4">
            <!-- Modulo Step 4 montato via JS -->
        </div>

    </main>

    <!-- Master Controller Script Wizard -->
    <script>
        class BookingWizardManager {
            constructor() {
                window.wizardManager = this;
                this.currentStep = 1;
                this.maxStepReached = 1;
                this.tourCorrente = null;
                this.codicePrenotazione = '';

                this.step1Module = null;
                this.step2Module = null;
                this.step3Module = null;
                this.step4Module = null;

                this.bookingData = {
                    code: '',
                    tourId: '1',
                    tourTitle: 'Tour Palermo',
                    dateISO: '',
                    dateReadable: '',
                    slotTime: '09:30',
                    adults: 1,
                    children: 0,
                    customerName: '',
                    customerEmail: '',
                    customerPhone: '',
                    notes: '',
                    total: '25.00'
                };

                this.init();
            }

            init() {
                this.codicePrenotazione = '#SPT-' + Math.floor(1000 + Math.random() * 9000);
                this.bookingData.code = this.codicePrenotazione;
                document.getElementById('booking-ref-code').textContent = `Codice: ${this.codicePrenotazione}`;

                const urlParams = new URLSearchParams(window.location.search);
                const tourId = urlParams.get('tourId') || '1';

                let itinerari = [];
                if (typeof getItinerari === 'function') {
                    try { itinerari = getItinerari() || []; } catch (e) {}
                }

                if (Array.isArray(itinerari) && itinerari.length > 0) {
                    this.tourCorrente = itinerari.find(t => String(t.id) === String(tourId)) || itinerari[0];
                }

                if (!this.tourCorrente) {
                    this.tourCorrente = {
                        id: tourId,
                        title: 'Tour Guidato Palermo Centro Storico',
                        price: '25€',
                        duration: '3 Ore',
                        category: 'Storia & Cultura',
                        meetingPoint: 'Piazza Politeama, Palermo',
                        imageUrl: 'https://images.unsplash.com/photo-1541370976299-4d24ebbc9077?auto=format&fit=crop&w=1200&q=80',
                        maxCapacity: 15
                    };
                }

                this.bookingData.tourId = String(this.tourCorrente.id || tourId);
                this.bookingData.tourTitle = this.tourCorrente.title || 'Tour Palermo';

                this.popolaHeroBanner();

                // Inizializza Moduli Step
                this.step1Module = new Step1DataOrario('step-card-1', {
                    tourData: this.tourCorrente,
                    onComplete: (data) => {
                        this.bookingData.dateISO = data.dateISO;
                        this.bookingData.dateReadable = data.dateReadable;
                        this.bookingData.slotTime = data.slotTime;

                        let cap = 15;
                        if (data.calendarInstance && data.calendarInstance.defaultSlots) {
                            const slotObj = data.calendarInstance.defaultSlots.find(s => s.time === data.slotTime);
                            if (slotObj) cap = slotObj.maxCapacity;
                        } else if (this.tourCorrente && this.tourCorrente.maxCapacity) {
                            cap = parseInt(this.tourCorrente.maxCapacity, 10);
                        }

                        if (this.step2Module) {
                            this.step2Module.setSlotInfo(data.slotTime, cap);
                        }

                        this.goToStep(2);
                    }
                });

                this.step2Module = new Step2Partecipanti('step-card-2', {
                    onPrev: () => this.goToStep(1),
                    onComplete: (data) => {
                        this.bookingData.adults = data.adults;
                        this.bookingData.children = data.children;
                        if (this.step3Module) {
                            this.step3Module.setPartecipanti(data.adults, data.children);
                        }
                        this.goToStep(3);
                    }
                });

                this.step3Module = new Step3Dati('step-card-3', {
                    onPrev: () => this.goToStep(2),
                    onComplete: (data) => {
                        alert("DEBUG: onComplete Step 3 eseguito, passo a Step 4");
                        try {
                            this.bookingData.customerName = data.customerName || 'Cliente';
                            this.bookingData.customerEmail = data.customerEmail || 'cliente@example.com';
                            this.bookingData.customerPhone = data.customerPhone || '+39';
                            this.bookingData.notes = data.notes || '';
                            this.bookingData.participantsList = data.participantsList || [];

                            this.calcolaEInviaRiepilogo();
                        } catch (e) {
                            console.error("Errore onComplete Step 3:", e);
                        }
                        this.goToStep(4);
                    }
                });

                this.step4Module = new Step4Conferma('step-card-4', {
                    onPrev: () => this.goToStep(3),
                    onConfirm: (res) => this.confermaDefinitiva(res)
                });

                this.goToStep(1);
            }

            popolaHeroBanner() {
                const tour = this.tourCorrente || { title: 'Tour Palermo', category: 'Tour', duration: '3 Ore', price: 'Da 25€', meetingPoint: 'Palermo Centro' };

                const heroImg = document.getElementById('tour-hero-img');
                if (heroImg && tour.imageUrl) {
                    heroImg.src = tour.imageUrl;
                }

                document.getElementById('booking-tour-category').textContent = tour.category || 'Tour';
                document.getElementById('booking-tour-title').textContent = tour.title || 'Tour Palermo';

                this.bookingData.tourTitle = tour.title || 'Tour Palermo';
                this.bookingData.tourId = String(tour.id || '1');

                document.getElementById('chip-duration').textContent = `⏱️ Durata: ${tour.duration || '3 Ore'}`;
                document.getElementById('chip-price').textContent = `💰 Prezzo: ${tour.price || 'Da 25€'}`;
                document.getElementById('chip-meeting').textContent = `📍 Incontro: ${tour.meetingPoint || 'Palermo Centro'}`;
            }

            calcolaEInviaRiepilogo() {
                const tour = this.tourCorrente || { price: '25€', title: 'Tour Palermo' };

                const match = (tour.price || '').match(/\d+/);
                const prezzoBase = match ? parseInt(match[0], 10) : 25;

                const adults = parseInt(this.bookingData.adults, 10) || 1;
                const children = parseInt(this.bookingData.children, 10) || 0;

                const totale = (adults * prezzoBase) + (children * (prezzoBase * 0.5));
                this.bookingData.total = totale > 0 ? totale.toFixed(2) : '25.00';

                if (this.step4Module) {
                    this.step4Module.renderSummary(this.bookingData);
                }
            }

            goToStep(stepNum) {
                this.currentStep = stepNum;
                if (stepNum > this.maxStepReached) {
                    this.maxStepReached = stepNum;
                }

                [1, 2, 3, 4].forEach(i => {
                    const card = document.getElementById(`step-card-${i}`);
                    const barItem = document.getElementById(`bar-step-${i}`);

                    if (card) {
                        if (i === stepNum) card.classList.remove('hidden-step');
                        else card.classList.add('hidden-step');
                    }

                    if (barItem) {
                        barItem.classList.remove('active', 'completed');
                        if (i === stepNum) barItem.classList.add('active');
                        else if (i < stepNum) barItem.classList.add('completed');
                    }
                });

                const activeCard = document.getElementById(`step-card-${stepNum}`);
                if (activeCard) {
                    activeCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }

                if (typeof aggiornaTraduzioneDinamica === 'function') {
                    aggiornaTraduzioneDinamica();
                }
            }

            tryGoToStep(stepNum) {
                this.calcolaEInviaRiepilogo();
                this.goToStep(stepNum);
            }

            confermaDefinitiva(res) {
                try {
                    const list = JSON.parse(localStorage.getItem('spt_bookings') || '[]');
                    const record = {
                        ...this.bookingData,
                        tourTitle: this.tourCorrente ? this.tourCorrente.title : (this.bookingData.tourTitle || 'Tour Palermo'),
                        tourId: String(this.tourCorrente ? this.tourCorrente.id : (this.bookingData.tourId || '1')),
                        time: this.bookingData.slotTime || '09:30',
                        paymentIntentId: (res && res.paymentIntentId) ? res.paymentIntentId : '',
                        id: Date.now().toString(),
                        createdAt: new Date().toLocaleString('it-IT'),
                        status: 'In attesa'
                    };
                    list.unshift(record);
                    localStorage.setItem('spt_bookings', JSON.stringify(list));

                    if (window.cloudDB) {
                        window.cloudDB.salvaPrenotazioniCloud(list);
                    }

                    this.scalaCapienzaPostiTour();

                    if (window.brevoEmailService) {
                        window.brevoEmailService.inviaEmailPrenotazione(record);
                    }
                } catch (e) {
                    console.error("Errore salvataggio booking o invio email Brevo:", e);
                }

                alert(`🎉 PRENOTAZIONE CONFERMATA CON SUCCESSO!\n\nCodice: ${this.bookingData.code}\nTour: ${this.bookingData.tourTitle}\nData: ${this.bookingData.dateReadable} - Orario: ${this.bookingData.slotTime}\nOspiti: ${this.bookingData.adults} Adulti${this.bookingData.children > 0 ? `, ${this.bookingData.children} Bambini` : ''}\nTotale: €${this.bookingData.total}\n\nGrazie ${this.bookingData.customerName}, la tua prenotazione è stata ricevuta. Ti risponderemo a breve!`);

                window.location.href = '../index.html';
            }

            scalaCapienzaPostiTour() {
                if (!this.tourCorrente) return;

                const totalePasseggeri = (parseInt(this.bookingData.adults, 10) || 1) + (parseInt(this.bookingData.children, 10) || 0);
                const targetSlot = this.bookingData.slotTime || '09:30';

                try {
                    let itinerari = [];
                    const saved = localStorage.getItem('spt_itineraries');
                    if (saved) itinerari = JSON.parse(saved);

                    if (!Array.isArray(itinerari) || itinerari.length === 0) {
                        if (typeof getItinerari === 'function') itinerari = getItinerari() || [];
                    }

                    if (!Array.isArray(itinerari) || itinerari.length === 0) return;

                    let modif = false;
                    itinerari = itinerari.map(tour => {
                        if (String(tour.id) === String(this.tourCorrente.id) || tour.title === this.tourCorrente.title) {
                            if (!tour.timeSlots || !Array.isArray(tour.timeSlots)) {
                                tour.timeSlots = [
                                    { time: '09:30', maxCapacity: 15, booked: 0 },
                                    { time: '11:30', maxCapacity: 15, booked: 0 },
                                    { time: '15:30', maxCapacity: 15, booked: 0 },
                                    { time: '18:00', maxCapacity: 15, booked: 0 }
                                ];
                            }
                            tour.timeSlots = tour.timeSlots.map(s => {
                                let slotTimeStr = typeof s === 'string' ? s : s.time;
                                if (slotTimeStr === targetSlot) {
                                    if (typeof s === 'string') {
                                        s = { time: slotTimeStr, maxCapacity: 15, booked: totalePasseggeri };
                                    } else {
                                        s.booked = (parseInt(s.booked, 10) || 0) + totalePasseggeri;
                                    }
                                    modif = true;
                                }
                                return s;
                            });
                        }
                        return tour;
                    });

                    if (modif) {
                        localStorage.setItem('spt_itineraries', JSON.stringify(itinerari));
                        if (window.cloudDB) {
                            window.cloudDB.salvaItinerariCloud(itinerari);
                        }
                    }
                } catch (e) {
                    console.error("Errore decremento capienza posti tour:", e);
                }
            }
        }
    </script>

    <script src="../translate/translator.js"></script>
    <script>
        let wizardManager = null;
        document.addEventListener('DOMContentLoaded', () => {
            wizardManager = new BookingWizardManager();
        });
    </script>
</body>
</html>
